name: dev

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          # cmake-format 0.6.13 is incompatible with Python 3.15's re.Scanner.
          python-version: '3.14'
      - name: pre-commit (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (--all-files)
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --all-files
